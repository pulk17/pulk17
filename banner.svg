<svg viewBox="0 0 880 220" width="880" height="220" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Pulkit — low-latency systems, C++">
  <style>
    .mono { font-family: ui-monospace, "SF Mono", "Cascadia Code", Menlo, Consolas, monospace; }
    .cursor { opacity: 0; }
    @media (prefers-reduced-motion: no-preference) {
      .cursor { animation: blink 1.1s steps(1) infinite; }
      @keyframes blink { 0%, 55% { opacity: 1; } 56%, 100% { opacity: 0; } }
    }
  </style>

  <!-- card -->
  <rect x="1.5" y="1.5" width="877" height="217" rx="14" fill="#0d1117" stroke="#212a35" stroke-width="1.5"/>

  <!-- left: identity -->
  <text x="52" y="78" class="mono" font-size="15" letter-spacing="6" fill="#4a5563">~/pulk17</text>
  <text x="50" y="128" class="mono" font-size="46" font-weight="700" fill="#e6edf3">pulkit</text>
  <text x="50" y="166" class="mono" font-size="19" letter-spacing="2.5" fill="#38bdae">low-latency systems · C++</text>
  <rect x="388" y="151" width="10" height="18" fill="#38bdae" class="cursor"/>

  <!-- right: L2 depth ladder (asks above spread, bids below) -->
  <g opacity="0.9">
    <!-- asks -->
    <rect x="668" y="38"  width="150" height="9" rx="2" fill="#b34a44"/>
    <rect x="716" y="53"  width="102" height="9" rx="2" fill="#b34a44" opacity="0.85"/>
    <rect x="744" y="68"  width="74"  height="9" rx="2" fill="#b34a44" opacity="0.7"/>
    <rect x="768" y="83"  width="50"  height="9" rx="2" fill="#b34a44" opacity="0.55"/>
    <!-- spread -->
    <line x1="640" y1="107" x2="818" y2="107" stroke="#2a3442" stroke-width="1" stroke-dasharray="3 4"/>
    <!-- bids -->
    <rect x="758" y="122" width="60"  height="9" rx="2" fill="#38bdae" opacity="0.55"/>
    <rect x="730" y="137" width="88"  height="9" rx="2" fill="#38bdae" opacity="0.7"/>
    <rect x="700" y="152" width="118" height="9" rx="2" fill="#38bdae" opacity="0.85"/>
    <rect x="654" y="167" width="164" height="9" rx="2" fill="#38bdae"/>
  </g>
  <text x="818" y="196" text-anchor="end" class="mono" font-size="11" letter-spacing="1.5" fill="#4a5563">ITCH 5.0 · 8.9M msg/s</text>
</svg>
